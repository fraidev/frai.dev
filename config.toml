baseURL = "https://frai.dev/"
locale = "en-US"
title = "frai"
timeZone = "America/Sao_Paulo"
enableRobotsTXT = true
capitalizeListTitles = false
pluralizeListTitles = false

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false

[menu]
  [[menu.main]]
    identifier = "home"
    name = "home"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "about"
    name = "about"
    url = "/about/"
    weight = 2
  [[menu.main]]
    identifier = "projects"
    name = "projects"
    url = "/projects/"
    weight = 3
  [[menu.main]]
    identifier = "contributions"
    name = "contributions"
    url = "/contributions/"
    weight = 4
  [[menu.main]]
    identifier = "posts"
    name = "posts"
    url = "/posts/"
    weight = 5
  [[menu.main]]
    identifier = "tags"
    name = "tags"
    url = "/tags/"
    weight = 6

[params]
  author = "Felipe Cardozo"
  handle = "frai"
  github = "fraidev"
  host = "frai.dev"
  description = "Felipe Cardozo"
  plan = "git gud"
  avatar = "/avatar.jpg"
  images = ["/avatar.jpg"]

  # Palette. Everything on the site derives from these five colors.
  [params.style]
    dark = "#212121"
    light = "#f5e3e0"
    lightest = "#f5f5f5"
    primary = "#219fd5"
    gold = "#e3b44a"

  # Party status card. Level 1 starts at epoch, one level per year,
  # EXP is days since epoch, LP is the number of merged pull requests.
  [params.ffxii]
    name = "Frai"
    image = "/party.jpg"
    epoch = "2017-01-21"

  [params.social]
    twitter = "fraidev"

  [[params.links]]
    name = "github"
    url = "https://github.com/fraidev"
  [[params.links]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/fraifelipe/"
  [[params.links]]
    name = "x"
    url = "https://x.com/fraidev"
  [[params.links]]
    name = "bsky"
    url = "https://bsky.app/profile/frai.dev"
  [[params.links]]
    name = "rss"
    url = "/index.xml"
